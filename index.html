<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@</title>
  <link id="favicon" rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- background -->
  <video id="bg-video" autoplay muted loop playsinline preload="auto"></video>
  <div id="bg-overlay"></div>
  <canvas id="snow"></canvas>

  <!-- intro -->
  <div id="intro">
    <canvas id="intro-canvas"></canvas>
    <div id="intro-name"></div>
    <div id="enter-hint"></div>
  </div>

  <!-- volume -->
  <div id="volume" class="hidden-ui">
    <button id="mute-btn" aria-label="mute">
      <svg id="ico-on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <svg id="ico-off" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.2l2.4 2.4c.1-.2.1-.4.1-.6zM19 12c0 .9-.2 1.8-.5 2.6l1.5 1.5A8.9 8.9 0 0 0 21 12a9 9 0 0 0-7-8.8v2.1A7 7 0 0 1 19 12zM4.3 3 3 4.3 7.7 9H3v6h4l5 5v-6.7l4.3 4.3c-.7.5-1.4.9-2.3 1.2v2.1a9 9 0 0 0 3.7-1.8l2 2 1.3-1.3L4.3 3zM12 4 9.9 6.1 12 8.2V4z"/></svg>
    </button>
    <input id="vol-range" type="range" min="0" max="1" step="0.01">
  </div>

  <!-- main -->
  <main id="card" class="hidden-ui">
    <div class="top">
      <div id="box"></div>
      <div class="meta">
        <span class="meta-item">
          <svg viewBox="0 0 24 24"><path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/></svg>
          <span id="views">0</span>
        </span>
        <span class="sep" id="loc-sep"></span>
        <span class="meta-item" id="loc-wrap">
          <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <span id="location"></span>
        </span>
      </div>
    </div>

    <div class="name-row">
      <h1 id="name" data-text=""></h1>
      <span id="name-badge"></span>
    </div>
    <p id="bio"></p>

    <div id="links"></div>

    <div id="discord" class="discord">
      <div class="dc-avatar">
        <img id="dc-avatar" alt="">
        <img id="dc-deco" alt="">
        <span id="dc-status" class="status offline"></span>
      </div>
      <div class="dc-info">
        <div class="dc-line">
          <span id="dc-name">discord</span>
          <span id="dc-tag" class="dc-tag"></span>
        </div>
        <div id="dc-activity">currently doing nothing</div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
